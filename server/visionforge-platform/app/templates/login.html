{% extends "base.html" %}
{% block title %}管理员登录 - VisionForge{% endblock %}
{% block main_class %}container-flush{% endblock %}
{% block content %}
<canvas id="shop-cosmos" class="auth-cosmos" aria-hidden="true"></canvas>
<div class="auth-wrap">
    <div class="auth-card border-beam" data-reveal="scale">
        <div class="auth-logo" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="8.6" stroke="url(#vf-g-auth)" stroke-width="1.5"/>
                <circle cx="12" cy="12" r="3" fill="#7c6ff0"/>
                <path d="M12 1.8v3.4M12 18.8v3.4M1.8 12h3.4M18.8 12h3.4" stroke="#67e8f9" stroke-width="1.3" stroke-linecap="round"/>
                <defs>
                    <linearGradient id="vf-g-auth" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#a78bfa"/><stop offset="1" stop-color="#67e8f9"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>
        <h2>管理员登录</h2>
        <p class="auth-sub">VisionForge 平台控制台</p>
        {% if msg %}<div class="alert alert-success">{{ msg }}</div>{% endif %}
        <form method="post" action="/auth/login">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" required placeholder="输入管理员账号" autocomplete="username">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" required placeholder="输入密码" autocomplete="current-password">
            </div>
            {% if totp_enabled %}
            <div class="form-group">
                <label>动态验证码</label>
                <input type="text" name="totp_code" required inputmode="numeric" autocomplete="one-time-code" maxlength="8">
            </div>
            {% endif %}
            <button type="submit" class="btn btn-primary" style="width:100%;">登录</button>
        </form>
    </div>
</div>
<script defer src="/static/js/shop_fx.js?v=2"></script>
{% endblock %}
