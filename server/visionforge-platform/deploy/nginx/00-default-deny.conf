server {
    listen 80 default_server;
    server_name _;
    access_log /var/log/nginx/access.log vf_sanitized;
    include /etc/nginx/snippets/vf-vmq-monitor-http.conf;
}

server {
    listen 443 ssl default_server;
    server_name _;
    client_max_body_size 270m;
    include /etc/nginx/snippets/vf-security-server.conf;
    access_log /var/log/nginx/access.log vf_sanitized;

    ssl_certificate /etc/nginx/ssl/visionforge-ip/server.pem;
    ssl_certificate_key /etc/nginx/ssl/visionforge-ip/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Request-ID $request_id always;

    location ^~ /api/client/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location ~ ^/update/[A-Za-z0-9_-]+\.json$ {
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        return 404;
    }
}
