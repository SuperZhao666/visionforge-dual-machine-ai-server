# Include inside the HTTPS server block before any generic /api location.
# The bridge resolves www.visionforge.cloud to Docker's host gateway, so this
# endpoint is reachable from the dedicated private subnet but not the Internet.
location = /api/integrations/code-issuances/issue {
    allow 127.0.0.1;
    allow 172.29.47.0/28;
    deny all;

    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}
