# VisionForge production site for the existing single server and domain.
# Install this file from Nginx's http context (for example sites-enabled/vf).
log_format vf_deploy_sanitized '$remote_addr - $remote_user [$time_local] '
                               '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                               '"-" "$http_user_agent" '
                               'request_time=$request_time request_id=$request_id';

limit_req_zone $binary_remote_addr zone=vf_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=vf_login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=vf_deploy_connections:10m;

map $uri $vf_deploy_release_cache_control {
    default "";
    ~^/static/releases/[0-9a-f]{64}\.(?:exe|vfdiff)$ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name visionforge.cloud www.visionforge.cloud;
    access_log /var/log/nginx/access.log vf_deploy_sanitized;
    return 301 https://www.visionforge.cloud$request_uri;
}

server {
    listen 443 ssl http2;
    server_name visionforge.cloud www.visionforge.cloud;
    access_log /var/log/nginx/access.log vf_deploy_sanitized;

    ssl_certificate /etc/letsencrypt/live/visionforge.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/visionforge.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:VFSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 270m;
    limit_conn vf_deploy_connections 50;
    limit_conn_status 429;
    client_header_timeout 15s;
    client_body_timeout 300s;
    send_timeout 300s;
    keepalive_timeout 65s;
    reset_timedout_connection on;
    proxy_connect_timeout 5s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Content-Security-Policy for HTML is emitted by FastAPI with a fresh
    # per-request script nonce.
    # Do not add a second proxy-layer CSP; browsers intersect duplicate
    # policies and would invalidate the application nonce.
    add_header X-Request-ID $request_id always;
    # Empty map values are not emitted. Missing artifacts are 404 and this
    # non-`always` header cannot create long-lived negative cache entries.
    add_header Cache-Control $vf_deploy_release_cache_control;

    # Runtime archives stay private. The authenticated API validates a short
    # HMAC ticket, then hands this content-addressed file to Nginx via
    # X-Accel-Redirect so multi-GiB Range transfers never flow through Uvicorn.
    location ~ ^/_runtime_artifacts/(?<runtime_artifact>[0-9a-f]{64}\.zip)$ {
        internal;
        alias /home/ubuntu/vf-platform/runtime_artifacts/$runtime_artifact;
        default_type application/zip;
        etag on;
        sendfile on;
        gzip off;
        max_ranges 1;
        limit_except GET { deny all; }
    }

    location /_runtime_artifacts/ {
        return 404;
    }

    # Release payloads are direct, content-addressed files on this server.
    location ~ ^/static/releases/(?<release_artifact>[0-9a-f]{64}\.(?:exe|vfdiff))$ {
        alias /home/ubuntu/vf-platform/app/static/releases/$release_artifact;
        default_type application/octet-stream;
        etag on;
        sendfile on;
        gzip off;
        max_ranges 1;
        limit_except GET { deny all; }
    }

    # Mutable names, nested paths and unexpected file types are never public.
    location /static/releases/ {
        return 404;
    }

    location /static/ {
        alias /home/ubuntu/vf-platform/app/static/;
        expires 7d;
    }

    # The callback signature is carried in the query string. Keep it out of
    # access/error logs while retaining the application's own limiter.
    location = /appPush {
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /auth/login {
        limit_req zone=vf_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        limit_req zone=vf_general burst=200 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
}
