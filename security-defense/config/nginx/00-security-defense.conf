# This file is included from nginx.conf's http context.
log_format vf_sanitized '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                        '"-" "$http_user_agent" '
                        'request_time=$request_time request_id=$request_id';

map $uri $vf_client_limit_key {
    default $binary_remote_addr;
    /appPush "";
}

# Only immutable, content-addressed EXE update artifacts receive a long cache.
# Empty map values are not emitted by add_header, so manifests and mutable
# legacy filenames retain their upstream/no-cache policy.
map $uri $vf_release_cache_control {
    default "";
    ~^/static/releases/[0-9a-f]{64}\.(?:exe|vfdiff)$ "public, max-age=31536000, immutable";
}

limit_req_zone $vf_client_limit_key zone=vf_per_ip:10m rate=50r/s;
limit_conn_zone $vf_client_limit_key zone=vf_connections:10m;

client_header_timeout 15s;
client_body_timeout 300s;
send_timeout 300s;
keepalive_timeout 65s;
reset_timedout_connection on;
