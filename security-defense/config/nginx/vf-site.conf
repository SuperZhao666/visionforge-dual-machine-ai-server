server {
    listen 80;
    server_name visionforge.cloud www.visionforge.cloud;
    access_log /var/log/nginx/access.log vf_sanitized;
    return 301 https://www.visionforge.cloud$request_uri;
}

server {
    listen 443 ssl http2;
    server_name visionforge.cloud www.visionforge.cloud;
    client_max_body_size 270m;
    include /etc/nginx/snippets/vf-security-server.conf;
    access_log /var/log/nginx/access.log vf_sanitized;

    ssl_certificate /etc/letsencrypt/live/visionforge.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/visionforge.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Request-ID $request_id always;
    # Without `always`, missing hash paths cannot become one-year negative-cache entries.
    add_header Cache-Control $vf_release_cache_control;

    location ~ ^/_runtime_artifacts/(?<runtime_artifact>[0-9a-f]{64}\.zip)$ {
        internal;
        alias /home/ubuntu/vf-platform/runtime_artifacts/$runtime_artifact;
        default_type application/zip;
        etag on;
        sendfile on;
        gzip off;
        max_ranges 1;
        limit_except GET { deny all; }
    }

    location /_runtime_artifacts/ {
        return 404;
    }

    # This callback carries a reusable signature in its query string. Its application-level
    # limiter remains active; Nginx request/error logging and edge limiting are disabled here.
    location = /appPush {
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:8000;
    }

    location ~ ^/static/releases/(?<release_artifact>[0-9a-f]{64}\.(?:exe|vfdiff))$ {
        alias /home/ubuntu/vf-platform/app/static/releases/$release_artifact;
        default_type application/octet-stream;
        etag on;
        sendfile on;
        gzip off;
        max_ranges 1;
        limit_except GET { deny all; }
    }

    location /static/releases/ {
        return 404;
    }

    # 微信登录 URL/QR 属于 bearer-like 凭据，禁止从公共静态目录交付。
    location = /static/img/wx_login_qr.png {
        access_log off;
        add_header Cache-Control "no-store, private, max-age=0" always;
        return 404;
    }

    location /static/ {
        alias /home/ubuntu/vf-platform/app/static/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
