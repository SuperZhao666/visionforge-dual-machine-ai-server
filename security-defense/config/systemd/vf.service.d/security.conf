[Service]
# Disable the optional plaintext third-party IP geolocation lookup.
Environment=IP_GEOLOOKUP_URL_TEMPLATE=
# Nginx keeps a query-redacted access log; avoid duplicating signed query strings in Uvicorn logs.
Environment=UVICORN_ACCESS_LOG=false
# Keep the immutable application tree free of runtime bytecode writes.
Environment=PYTHONDONTWRITEBYTECODE=1
# 服务创建的日志包、数据库临时文件和管理端导出默认仅允许运行账号访问。
UMask=0077
NoNewPrivileges=yes
PrivateTmp=yes
PrivateDevices=yes
PrivateMounts=yes
ProtectSystem=full
# The service may read the deployed application, but it may only mutate
# explicitly designated state directories inside that tree.
ReadOnlyPaths=/home/ubuntu/vf-platform
ReadWritePaths=/home/ubuntu/vf-platform/data
ReadWritePaths=/home/ubuntu/vf-platform/log_storage
ReadWritePaths=/home/ubuntu/vf-platform/app/static/img
ProtectHostname=yes
ProtectClock=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
LockPersonality=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
SystemCallArchitectures=native
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
CapabilityBoundingSet=
AmbientCapabilities=
