def readQnnSdkIdentity = { File sdkRoot ->
    File metadata = new File(sdkRoot, 'sdk.yaml')
    if (!metadata.isFile() || metadata.length() == 0L || metadata.length() > 128 * 1024L) {
        throw new GradleException("QNN SDK metadata is missing or invalid: ${metadata}")
    }
    byte[] bytes = metadata.bytes
    if (bytes.length >= 3
            && (bytes[0] & 0xff) == 0xef
            && (bytes[1] & 0xff) == 0xbb
            && (bytes[2] & 0xff) == 0xbf) {
        throw new GradleException("QNN SDK metadata must be UTF-8 without BOM: ${metadata}")
    }
    List<String> versions = []
    List<String> buildIds = []
    new String(bytes, java.nio.charset.StandardCharsets.UTF_8).readLines().each { String line ->
        if (line ==~ /^version\s*:.*$/) {
            def match = line =~ /^version\s*:\s*([0-9]+\.[0-9]+\.[0-9]+)\s*$/
            if (!match.matches()) {
                throw new GradleException("Invalid QNN SDK version metadata: ${metadata}")
            }
            versions.add(match.group(1))
        }
        if (line ==~ /^build_id\s*:.*$/) {
            def match = line =~ /^build_id\s*:\s*([0-9]{12}_[0-9]+)\s*$/
            if (!match.matches()) {
                throw new GradleException("Invalid QNN SDK build_id metadata: ${metadata}")
            }
            buildIds.add(match.group(1))
        }
    }
    if (versions.size() != 1 || buildIds.size() != 1) {
        throw new GradleException(
                "QNN SDK metadata must contain one version and one build_id: ${metadata}")
    }
    String buildId = buildIds.first()
    return [
            version: versions.first(),
            buildId: buildId,
            normalized: "${versions.first()}.${buildId.substring(0, 6)}"
    ]
}
def requireQnnSdkIdentity = { File sdkRoot, String approvedIdentity ->
    if (approvedIdentity == null
            || !(approvedIdentity ==~ /[0-9]+\.[0-9]+\.[0-9]+\.[0-9]{6}/)) {
        throw new GradleException(
                "Approved QNN model SDK identity is invalid: ${approvedIdentity}")
    }
    def currentIdentity = readQnnSdkIdentity(sdkRoot)
    if (currentIdentity.normalized != approvedIdentity) {
        throw new GradleException(
                "QNN SDK/model toolchain identity mismatch: current="
                        + "${currentIdentity.normalized} approved=${approvedIdentity}")
    }
    return currentIdentity
}
def parseQnnHtpArchitectures = { String configured ->
    LinkedHashSet<String> parsed = new LinkedHashSet<>()
    configured.split('[,;]').each { String value ->
        String architecture = value.trim().toLowerCase(Locale.ROOT)
        if (architecture.isEmpty()) return
        if (!(architecture ==~ /v[0-9]{2,3}/) || !parsed.add(architecture)) {
            throw new GradleException(
                    "Invalid or duplicate QNN HTP architecture: ${architecture}")
        }
    }
    if (parsed.isEmpty()) {
        throw new GradleException('At least one QNN HTP architecture is required.')
    }
    return parsed.toList()
}
def requiredQnnHtpArchitectures = parseQnnHtpArchitectures(
        providers.gradleProperty('requiredQnnHtpArchitectures').getOrElse(
                System.getenv('VISIONFORGE_REQUIRED_QNN_HTP_ARCHITECTURES')
                        ?: qnnBaselineHtpArchitectures.join(',')))
def discoverQnnHtpArchitectures = { File sdkRoot ->
    File androidLibraries = new File(sdkRoot, 'lib/aarch64-android')
    if (!androidLibraries.isDirectory()) return []
    LinkedHashSet<String> discovered = new LinkedHashSet<>()
    File[] libraries = androidLibraries.listFiles()
    if (libraries == null) return []
    libraries.each { File library ->
        def match = library.name =~ /^libQnnHtpV([0-9]{2,3})Stub\.so$/
        if (!library.isFile() || !match.matches()) return
        int architectureNumber = Integer.parseInt(match.group(1))
        // QnnDevice's public online platform API supports HTP V68 and newer.
        if (architectureNumber < 68) return
        String architecture = "v${architectureNumber}"
        String upper = architecture.toUpperCase(Locale.ROOT)
        File skeleton = new File(
                sdkRoot,
                "lib/hexagon-${architecture}/unsigned/libQnnHtp${upper}Skel.so")
        if (skeleton.isFile()) discovered.add(architecture)
    }
    return discovered.toList().sort { left, right ->
        Integer.parseInt(left.substring(1)) <=> Integer.parseInt(right.substring(1))
    }
}
def missingRequiredQnnHtpArchitectures = { List<String> required, List<String> available ->
    required.findAll { !available.contains(it) }
}
