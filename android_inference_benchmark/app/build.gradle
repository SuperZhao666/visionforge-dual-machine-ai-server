def releaseApkArtifact = layout.buildDirectory.file(
        'outputs/apk/release/app-release.apk')
def verifyMobileReleaseElfPageAlignmentTask = tasks.register(
        'verifyMobileReleaseElfPageAlignment', JavaExec) {
    group = 'verification'
    description = 'Rejects arm64 release libraries whose ELF LOAD segments cannot use 16 KB pages.'
    dependsOn(
            tasks.named('compileMobileRuntimeSnapshotSelfTest'),
            tasks.named('packageRelease'))
    classpath = files(runtimeSnapshotSelfTestClasses)
    mainClass = 'com.visionforge.inferencebenchmark.MobileReleaseElfPageAlignmentSelfTest'
    doFirst {
        File apk = releaseApkArtifact.get().asFile
        if (!apk.isFile()) {
            throw new GradleException("Release APK is missing: ${apk}")
        }
        systemProperty 'visionforge.release.apk', apk.absolutePath
    }
}
def verifyMobileReleaseZipAlignmentTask = tasks.register(
        'verifyMobileReleaseZipAlignment16Kb', Exec) {
    group = 'verification'
    description = 'Rejects release APK native entries that are not 16 KB ZIP aligned.'
    dependsOn(tasks.named('packageRelease'))
    doFirst {
        String executableName = System.getProperty('os.name')
                .toLowerCase(Locale.ROOT).contains('windows')
                ? 'zipalign.exe' : 'zipalign'
        File executable = new File(
                android.sdkDirectory,
                "build-tools/${android.buildToolsVersion}/${executableName}")
        File apk = releaseApkArtifact.get().asFile
        if (!executable.isFile()) {
            throw new GradleException("zipalign is missing: ${executable}")
        }
        if (!apk.isFile()) {
            throw new GradleException("Release APK is missing: ${apk}")
        }
        commandLine(
                executable.absolutePath,
                '-c', '-P', '16', '4', apk.absolutePath)
    }
}
def verifyMobileReleasePageCompatibilityTask = tasks.register(
        'verifyMobileReleasePageCompatibility') {
    group = 'verification'
    description = 'Verifies 16 KB ZIP and arm64 ELF alignment for modern Android devices.'
    dependsOn(
            verifyMobileReleaseElfPageAlignmentTask,
            verifyMobileReleaseZipAlignmentTask)
}
tasks.named('check').configure {
    dependsOn(tasks.named('verifyMobileReleaseContracts'))
}
tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') {
        task.dependsOn(tasks.named('verifyMobileReleaseContracts'))
    }
    if (task.name == 'assembleRelease') {
        task.dependsOn(verifyMobileReleasePageCompatibilityTask)
    }
}
