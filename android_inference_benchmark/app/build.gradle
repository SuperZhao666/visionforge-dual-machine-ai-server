def requireCs2DistributionScope = {
        boolean productionSigning,
        boolean integrationOnly ->
    if (productionSigning && integrationOnly) {
        throw new GradleException(
                'Production-signed APK cannot package the CS2 integration-only artifact. '
                        + 'A reviewed manifest with commercial_release_eligible=true is required.')
    }
    return integrationOnly ? 'device_test_only' : 'commercial_release'
