def qnnArtifactSha256 = { File artifact ->
    if (!artifact.isFile() || artifact.length() == 0L) {
        throw new GradleException("Required QNN artifact is missing: ${artifact}")
    }
    dualMachineSha256Hex(artifact.bytes).toUpperCase(Locale.ROOT)
}
def readQnnModelSdkIdentity = { File library ->
    if (!library.isFile() || library.length() == 0L) {
        throw new GradleException("Required QNN model library is missing: ${library}")
    }
    String binary = new String(
            library.bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
    def matcher = binary =~ /qaisw-v([0-9]+\.[0-9]+\.[0-9]+)\.([0-9]{12}_[0-9]+)/
    LinkedHashSet<String> identities = new LinkedHashSet<>()
    matcher.each { match ->
        identities.add("${match[1]}.${match[2]}")
    }
    if (identities.size() != 1) {
        throw new GradleException(
                "QNN model library must embed exactly one SDK identity: ${library}")
    }
    return identities.first()
}
def requirePackagedQnnModelSdkIdentities = { def currentIdentity ->
    String expectedFullIdentity =
            "${currentIdentity.version}.${currentIdentity.buildId}"
    packagedQnnModelLibraries.each { File library ->
        String embeddedIdentity = readQnnModelSdkIdentity(library)
        if (embeddedIdentity != expectedFullIdentity) {
            throw new GradleException(
                    "QNN model library SDK identity mismatch: model=${library.name}"
                            + " embedded=${embeddedIdentity}"
                            + " current=${expectedFullIdentity}")
        }
    }
}
def readStrictQnnJson = { File artifact ->
    if (!artifact.isFile() || artifact.length() == 0L) {
        throw new GradleException("Required QNN manifest is missing: ${artifact}")
    }
    byte[] bytes = artifact.bytes
    if (bytes.length >= 3
            && (bytes[0] & 0xff) == 0xef
            && (bytes[1] & 0xff) == 0xbb
            && (bytes[2] & 0xff) == 0xbf) {
        throw new GradleException("QNN manifest must be UTF-8 without BOM: ${artifact}")
    }
    try {
        return new JsonSlurper().parseText(
                new String(bytes, java.nio.charset.StandardCharsets.UTF_8))
    } catch (Exception invalid) {
        throw new GradleException("Invalid QNN JSON manifest: ${artifact}", invalid)
    }
}
def requireApprovedOw2QnnRelease = {
    def buildManifest = readStrictQnnJson(ow2QnnBuildManifest)
    def numericContract = readStrictQnnJson(ow2QnnNumericContract)
    def releaseManifest = readStrictQnnJson(ow2QnnReleaseManifest)
    String approvedQnnSdkIdentity = buildManifest.toolchain?.qnn_sdk_version
    if (buildManifest.schema != 'visionforge-ow2-static-w8a16-build-v1'
            || buildManifest.build_complete != true
            || buildManifest.release_eligible != false
            || buildManifest.model?.token != 'overwatch2-416-yolov5'
            || buildManifest.model?.input != [1, 3, 416, 416]
            || buildManifest.model?.anchors != 3549
            || buildManifest.model?.classes != 2
            || buildManifest.model?.control_class != 0
            || buildManifest.model?.raw_tensor != '539'
            || approvedQnnSdkIdentity == null
            || !(approvedQnnSdkIdentity ==~
            /[0-9]+\.[0-9]+\.[0-9]+\.[0-9]{6}/)
            || buildManifest.calibration?.count != 15) {
        throw new GradleException('OW2 QNN build manifest contract is invalid.')
    }
    if (numericContract.schema != 'visionforge-ow2-qnn-numeric-contract-v1'
            || numericContract.ok != true) {
        throw new GradleException('OW2 phone HTP numeric contract is not approved.')
    }
    expectedOw2NumericChecks.each { String checkName ->
        if (numericContract.checks?.get(checkName) != true) {
            throw new GradleException(
                    "OW2 phone HTP numeric check is missing or false: ${checkName}")
        }
    }
    if (releaseManifest.schema != 'visionforge-ow2-static-w8a16-release-v1'
            || releaseManifest.complete != true
            || releaseManifest.phone_htp_numeric_verified != true) {
        throw new GradleException('OW2 QNN release manifest is incomplete.')
    }

    String sourceHash = qnnArtifactSha256(ow2QnnCanonicalSource)
    String splitHash = qnnArtifactSha256(ow2QnnCanonicalSplit)
    String libraryHash = qnnArtifactSha256(ow2QnnCanonicalLibrary)
    String buildManifestHash = qnnArtifactSha256(ow2QnnBuildManifest)
    String numericContractHash = qnnArtifactSha256(ow2QnnNumericContract)
    if (sourceHash != approvedOw2SourceSha256
            || buildManifest.artifacts?.source_onnx?.sha256 != sourceHash
            || numericContract.artifacts?.source_onnx?.sha256 != sourceHash
            || releaseManifest.source_onnx_sha256 != sourceHash
            || buildManifest.artifacts?.split_onnx?.sha256 != splitHash
            || numericContract.artifacts?.rewritten_onnx?.sha256 != splitHash
            || releaseManifest.split_onnx_sha256 != splitHash
            || buildManifest.artifacts?.android_library?.sha256 != libraryHash
            || numericContract.artifacts?.qnn_android_model_library?.sha256 != libraryHash
            || releaseManifest.android_library_sha256 != libraryHash
            || releaseManifest.build_manifest_sha256 != buildManifestHash
            || releaseManifest.numeric_contract_sha256 != numericContractHash) {
        throw new GradleException('OW2 QNN release artifact hash closure is invalid.')
    }
    def currentQnnSdkIdentity = requireQnnSdkIdentity(
            new File(qnnSdkRoot), approvedQnnSdkIdentity)
    requirePackagedQnnModelSdkIdentities(currentQnnSdkIdentity)
    return libraryHash
}

def requireApprovedCs2QnnIntegration = {
    def buildManifest = readStrictQnnJson(cs2QnnBuildManifest)
    def numericContract = readStrictQnnJson(cs2QnnNumericContract)
    def releaseManifest = readStrictQnnJson(cs2QnnReleaseManifest)
    String approvedQnnSdkIdentity = buildManifest.toolchain?.qnn_sdk_version
    if (buildManifest.schema != 'visionforge-cs2-vombit-w8a16-build-v1'
            || buildManifest.build_complete != true
            || buildManifest.release_eligible != false
            || buildManifest.model?.token != 'counter-strike-2-vombit-416-v8s'
            || buildManifest.model?.input != [1, 3, 416, 416]
            || buildManifest.model?.anchors != 3549
            || buildManifest.model?.classes != 4
            || buildManifest.model?.class_names !=
            ['ct_body', 'ct_head', 't_body', 't_head']
            || buildManifest.model?.target_pairs != [[0, 1], [2, 3]]
            || buildManifest.model?.output_names !=
            ['output_coordinates', 'output_confidences']
            || buildManifest.licensing?.source_metadata_declares != 'AGPL-3.0'
            || buildManifest.licensing?.commercial_distribution_review_required != true
            || approvedQnnSdkIdentity == null
            || !(approvedQnnSdkIdentity ==~
            /[0-9]+\.[0-9]+\.[0-9]+\.[0-9]{6}/)
            || buildManifest.calibration?.count != 15) {
        throw new GradleException('CS2 QNN build manifest contract is invalid.')
    }
    if (numericContract.schema != 'visionforge-cs2-qnn-numeric-contract-v1'
            || numericContract.ok != true) {
        throw new GradleException('CS2 phone HTP numeric contract is not approved.')
    }
    expectedCs2NumericChecks.each { String checkName ->
        if (numericContract.checks?.get(checkName) != true) {
            throw new GradleException(
                    "CS2 phone HTP numeric check is missing or false: ${checkName}")
        }
    }
    if (releaseManifest.schema != 'visionforge-cs2-vombit-w8a16-release-v1'
            || releaseManifest.complete != true
            || releaseManifest.integration_eligible != true
            || releaseManifest.phone_htp_numeric_verified != true
            || releaseManifest.commercial_distribution_review_required != true
            || releaseManifest.commercial_release_eligible != false) {
        throw new GradleException('CS2 QNN integration manifest is incomplete.')
    }

    String sourceHash = qnnArtifactSha256(cs2QnnCanonicalSource)
    String splitHash = qnnArtifactSha256(cs2QnnCanonicalSplit)
    String libraryHash = qnnArtifactSha256(cs2QnnCanonicalLibrary)
    String buildManifestHash = qnnArtifactSha256(cs2QnnBuildManifest)
    String numericContractHash = qnnArtifactSha256(cs2QnnNumericContract)
    if (sourceHash != approvedCs2SourceSha256
            || buildManifest.artifacts?.source_onnx?.sha256 != sourceHash
            || numericContract.artifacts?.source_onnx?.sha256 != sourceHash
            || releaseManifest.source_onnx_sha256 != sourceHash
            || buildManifest.artifacts?.split_onnx?.sha256 != splitHash
            || numericContract.artifacts?.rewritten_onnx?.sha256 != splitHash
            || releaseManifest.split_onnx_sha256 != splitHash
            || buildManifest.artifacts?.android_library?.sha256 != libraryHash
            || numericContract.artifacts?.qnn_android_model_library?.sha256 != libraryHash
            || releaseManifest.android_library_sha256 != libraryHash
            || releaseManifest.build_manifest_sha256 != buildManifestHash
            || releaseManifest.numeric_contract_sha256 != numericContractHash) {
        throw new GradleException('CS2 QNN integration artifact hash closure is invalid.')
    }
    boolean integrationOnly = buildManifest.release_eligible != true
            || releaseManifest.commercial_release_eligible != true
    String distributionScope = requireCs2DistributionScope(
            hasProductionReleaseSigning, integrationOnly)
    requireQnnSdkIdentity(new File(qnnSdkRoot), approvedQnnSdkIdentity)
    logger.lifecycle(
            "CS2_QNN_DISTRIBUTION_BOUNDARY_OK scope=${distributionScope}")
    return libraryHash
}

// A model archive may deduplicate equal files with NTFS hard links. Copying a
// source onto a hard-linked staging target truncates the shared inode before it
// can be read. Detach only the staging directory entry; the verified source is
// left untouched and Sync recreates the target normally.
def detachHardLinkedSyncTargets = { def syncTask, File destinationDirectory ->
    syncTask.source.files.findAll { it.isFile() }.each { File sourceFile ->
        File targetFile = new File(destinationDirectory, sourceFile.name)
        if (!targetFile.isFile()) return
        def sourceEntry = sourceFile.toPath().toAbsolutePath().normalize()
        def targetEntry = targetFile.toPath().toAbsolutePath().normalize()
        if (sourceEntry == targetEntry) {
            throw new GradleException(
                    "Sync source and destination paths must differ: ${sourceFile}")
        }
        if (java.nio.file.Files.isSameFile(sourceEntry, targetEntry)) {
            java.nio.file.Files.delete(targetEntry)
            logger.lifecycle(
                    "Detached hard-linked QNN staging target before Sync: ${targetFile.name}")
        }
    }
}

