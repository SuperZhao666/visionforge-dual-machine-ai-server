def dualMachineSha256Hex = { byte[] value ->
    MessageDigest.getInstance('SHA-256')
            .digest(value)
            .collect { String.format('%02x', it & 0xff) }
            .join('')
}
def requireDualMachineTlsPins = { String configured ->
    List<String> pins = configured
            .split('[,;]')
            .collect { it.trim() }
            .findAll { !it.isEmpty() }
    if (pins.size() < 2 || pins.size() > 4 || pins.toSet().size() != pins.size()) {
        throw new GradleException(
                'Release requires 2-4 distinct SHA-256 SPKI pins '
                        + '(current plus offline backup) via '
                        + 'VISIONFORGE_DUAL_MACHINE_TLS_SPKI_PINS.')
    }
    pins.each { String pin ->
        if (!(pin ==~ /sha256\/[A-Za-z0-9+\/]{43}=/)) {
            throw new GradleException("Dual-machine TLS pin is not canonical: ${pin}")
        }
        String encoded = pin.substring('sha256/'.length())
        byte[] digest
        try {
            digest = Base64.decoder.decode(encoded)
        } catch (IllegalArgumentException invalid) {
            throw new GradleException("Dual-machine TLS pin is invalid: ${pin}", invalid)
        }
        if (digest.length != 32 || Base64.encoder.encodeToString(digest) != encoded) {
            throw new GradleException("Dual-machine TLS pin is not canonical: ${pin}")
        }
    }
    return pins
}
def requireDualMachineTicketPublicKeyId = { File keyFile ->
    if (!keyFile.isFile()) {
        throw new GradleException(
                "Dual-machine ticket public key is missing: ${keyFile}")
    }
    byte[] contents = keyFile.bytes
    if (contents.length < 256 || contents.length > 16 * 1024) {
        throw new GradleException(
                "Dual-machine ticket public key PEM size is invalid: ${keyFile}")
    }
    String text = new String(contents, java.nio.charset.StandardCharsets.US_ASCII).trim()
    String begin = '-----BEGIN PUBLIC KEY-----'
    String end = '-----END PUBLIC KEY-----'
    if (!text.startsWith(begin)
            || !text.endsWith(end)
            || text.contains('PRIVATE KEY')
            || text.indexOf(begin, 1) >= 0) {
        throw new GradleException(
                "Dual-machine ticket key must be exactly one public PEM: ${keyFile}")
    }
    byte[] der
    try {
        der = Base64.decoder.decode(
                text.substring(begin.length(), text.length() - end.length())
                        .replaceAll('\\s', ''))
    } catch (IllegalArgumentException invalid) {
        throw new GradleException(
                "Dual-machine ticket public key PEM body is invalid: ${keyFile}",
                invalid)
    }
    def publicKey = KeyFactory.getInstance('RSA')
            .generatePublic(new X509EncodedKeySpec(der))
    if (!(publicKey instanceof RSAPublicKey)
            || publicKey.modulus.bitLength() < 3072
            || !MessageDigest.isEqual(publicKey.encoded, der)) {
        throw new GradleException(
                "Dual-machine ticket key must be canonical RSA-3072+ SPKI: ${keyFile}")
    }
    return dualMachineSha256Hex(der).substring(0, 16)
}
def encodedPublicKeyFile = { String path ->
    if (path == null || path.isBlank()) return ''
    File keyFile = file(path)
    if (!keyFile.isFile()) return ''
    byte[] contents = keyFile.bytes
    requireDualMachineTicketPublicKeyId(keyFile)
    return java.util.Base64.encoder.encodeToString(contents)
}
def encodedTicketPublicKeys = {
    List<String> paths = []
    if (!dualMachineTicketPublicKeyFile.isBlank()) {
        paths.add(dualMachineTicketPublicKeyFile)
    }
    dualMachinePreviousTicketPublicKeyFiles
            .split(';')
            .collect { it.trim() }
            .findAll { !it.isEmpty() }
            .each { paths.add(it) }
    return paths.collect(encodedPublicKeyFile).findAll { !it.isEmpty() }.join(';')
}
def loadReleaseKeyStore = { File store ->
    List<String> storeTypes = store.name.toLowerCase(Locale.ROOT).endsWith('.jks')
            ? ['JKS', 'PKCS12']
            : ['PKCS12', 'JKS']
    Exception lastFailure = null
    for (String storeType in storeTypes) {
        try {
            KeyStore keyStore = KeyStore.getInstance(storeType)
            store.withInputStream { input ->
                keyStore.load(input, releaseStorePassword.toCharArray())
            }
            return keyStore
        } catch (Exception failure) {
            lastFailure = failure
        }
    }
    throw new GradleException("Release signing keystore could not be read: ${store}", lastFailure)
}
def requireProductionReleaseSigningCertificate = {
    File store = file(releaseStoreFile)
    if (!store.isFile()) {
        throw new GradleException("Release signing keystore is missing: ${store}")
    }
    def workspacePath = rootProject.projectDir.parentFile.canonicalFile.toPath()
    if (store.canonicalFile.toPath().startsWith(workspacePath)) {
        throw new GradleException(
                'Release signing keystore must stay outside the repository workspace.')
    }
    KeyStore keyStore = loadReleaseKeyStore(store)
    def certificate = keyStore.getCertificate(releaseKeyAlias)
    if (!(certificate instanceof X509Certificate)) {
        throw new GradleException(
                "Release signing alias does not contain an X.509 certificate: ${releaseKeyAlias}")
    }
    try {
        certificate.checkValidity()
    } catch (Exception invalidValidity) {
        throw new GradleException(
                'Release signing certificate is expired or not yet valid.',
                invalidValidity)
    }
    String certificateSha256 = dualMachineSha256Hex(certificate.encoded)
    String subject = certificate.subjectX500Principal.name
    if (certificateSha256 == androidDebugCertSha256
            || subject.contains('CN=Android Debug')) {
        throw new GradleException(
                'Release signing certificate is the Android Debug certificate.')
    }
    def signingKey = certificate.publicKey
    boolean strongSigningKey = signingKey instanceof RSAPublicKey
            ? signingKey.modulus.bitLength() >= 3072
            : signingKey instanceof ECPublicKey
                    && signingKey.params.curve.field.fieldSize >= 256
    String signatureAlgorithm = certificate.sigAlgName.toUpperCase(Locale.ROOT)
    if (!strongSigningKey
            || !(signatureAlgorithm.contains('SHA256')
            || signatureAlgorithm.contains('SHA384')
            || signatureAlgorithm.contains('SHA512'))) {
        throw new GradleException(
                'Release signing certificate requires RSA-3072+ or EC-256+ with SHA-2.')
    }
    return certificateSha256
}

def productionReleaseSigningCertificateSha256 = hasProductionReleaseSigning
        ? requireProductionReleaseSigningCertificate()
        : ''

android {
    namespace = 'com.visionforge.inferencebenchmark'
    compileSdk 35

    signingConfigs {
        release {
            // minSdk 29 makes the legacy JAR signature unnecessary. Keep only
            // whole-APK signing schemes that detect content-table tampering.
            enableV1Signing = false
            enableV2Signing = true
            enableV3Signing = true
            enableV4Signing = false
            if (hasProductionReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        qa {
            initWith debug
            matchingFallbacks = ['debug']
            // Keep physical-device QA installable beside the production app.
            applicationIdSuffix '.qa'
            versionNameSuffix '-qa'
            resValue 'string', 'app_name', 'VF QA'
        }
        release {
            minifyEnabled true
            shrinkResources = true
            proguardFiles(
                    getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro')
            buildConfigField(
                    'boolean',
                    'APP_SIGNING_INTEGRITY_REQUIRED',
                    Boolean.toString(hasProductionReleaseSigning))
            buildConfigField(
                    'String',
                    'EXPECTED_APP_SIGNING_CERTIFICATE_SHA256',
                    buildConfigString(productionReleaseSigningCertificateSha256))
            if (hasProductionReleaseSigning) {
                signingConfig signingConfigs.release
            } else if (allowDevelopmentReleaseSigning) {
                signingConfig signingConfigs.debug
            }
        }
    }

    defaultConfig {
        applicationId 'com.visionforge.mobile'
        minSdk 29
        targetSdk 35
        versionCode productionVersionCode
        versionName productionVersionName
        testInstrumentationRunner(
                'com.visionforge.inferencebenchmark.PairingIdentityTestInstrumentation')
        buildConfigField(
                'String',
                'DUAL_MACHINE_API_ORIGIN',
                buildConfigString(canonicalDualMachineApiBaseUrl))
        buildConfigField(
                'String',
                'DUAL_MACHINE_PROTOCOL_CLIENT_VERSION',
                buildConfigString(dualMachineReleaseManifest.client_protocol_version as String))
        buildConfigField(
                'String',
                'DUAL_MACHINE_RELEASE_ID',
                buildConfigString(dualMachineReleaseManifest.release_id as String))
        buildConfigField(
                'String',
                'DUAL_MACHINE_TLS_SPKI_PINS',
                buildConfigString(dualMachineTlsSpkiPins))
        buildConfigField(
                'String',
                'DUAL_MACHINE_TICKET_PUBLIC_KEYS_BASE64',
                buildConfigString(encodedTicketPublicKeys()))
        buildConfigField(
                'boolean',
                'APP_SIGNING_INTEGRITY_REQUIRED',
                'false')
        buildConfigField(
                'String',
                'EXPECTED_APP_SIGNING_CERTIFICATE_SHA256',
                buildConfigString(''))

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20'
                arguments(
                        "-DQNN_SDK_ROOT=${providers.gradleProperty('qnnSdkRoot').getOrElse(System.getenv('QNN_SDK_ROOT') ?: '')}",
                        "-DONNXRUNTIME_ANDROID_AAR=${onnxRuntimeAndroidAar.absolutePath.replace('\\\\', '/')}")
            }
        }

        ndk {
            // x86_64 exists only for the official emulator compatibility
            // lane. Physical releases continue to use arm64-v8a.
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version = '3.22.1'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    buildFeatures {
        buildConfig = true
    }
}

tasks.register('verifyDualMachineReleaseSecurityInputs') {
    group = 'verification'
    description = 'Rejects release builds without rotated TLS pins and pinned public lease keys.'
    doLast {
        requireDualMachineTlsPins(dualMachineTlsSpkiPins)
        List<String> keyPaths = []
        if (!dualMachineTicketPublicKeyFile.isBlank()) {
            keyPaths.add(dualMachineTicketPublicKeyFile)
        }
        keyPaths.addAll(
                dualMachinePreviousTicketPublicKeyFiles
                        .split(';')
                        .collect { it.trim() }
                        .findAll { !it.isEmpty() })
        if (keyPaths.isEmpty() || keyPaths.size() > 3) {
            throw new GradleException(
                    'Release requires 1-3 pinned RS256 public ticket keys.')
        }
        String deployedKeyId = requireDualMachineTicketPublicKeyId(
                deployedDualMachineTicketPublicKeyFile)
        String primaryKeyId = requireDualMachineTicketPublicKeyId(file(keyPaths.first()))
        if (primaryKeyId != deployedKeyId) {
            throw new GradleException(
                    "Primary dual-machine ticket key ${primaryKeyId} does not match the deployed production Sidecar key ${deployedKeyId}.")
        }
        Set<String> keyIds = new LinkedHashSet<>()
        keyPaths.each { String keyPath ->
            String keyId = requireDualMachineTicketPublicKeyId(file(keyPath))
            if (!keyIds.add(keyId)) {
                throw new GradleException(
                        "Dual-machine ticket public key is duplicated: ${keyPath}")
            }
        }
    }
}

tasks.register('verifyProductionReleaseVersion') {
    group = 'verification'
    description = 'Rejects prerelease labels and non-monotonic production APK versions.'
    inputs.file(dualMachineReleaseVersionFile)
            .withPathSensitivity(PathSensitivity.RELATIVE)
    doLast {
        if (productionVersionCode <= previouslyReleasedVersionCode) {
            throw new GradleException(
                    "Production versionCode ${productionVersionCode} must be greater than "
                            + "the previously released code ${previouslyReleasedVersionCode}.")
        }
        if (!(productionVersionName ==~ /\d+\.\d+\.\d+/)) {
            throw new GradleException(
                    "Production versionName must be stable SemVer without a prerelease label: "
                            + productionVersionName)
        }
    }
}

tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') {
        task.dependsOn(
                tasks.named('verifyDualMachineReleaseSecurityInputs'),
                tasks.named('verifyProductionReleaseVersion'))
    }
}

