tasks.register('verifyCs2DistributionBoundaryPolicy') {
    group = 'verification'
    description = 'Prevents an integration-only CS2 artifact from entering a production-signed APK.'
    doLast {
        if (requireCs2DistributionScope(false, true) != 'device_test_only') {
            throw new GradleException('CS2 device-test distribution scope is invalid.')
        }
        if (requireCs2DistributionScope(true, false) != 'commercial_release') {
            throw new GradleException('CS2 commercial distribution scope is invalid.')
        }
        try {
            requireCs2DistributionScope(true, true)
            throw new GradleException(
                    'Production signing accepted an integration-only CS2 artifact.')
        } catch (GradleException expected) {
            if (expected.message
                    == 'Production signing accepted an integration-only CS2 artifact.') {
                throw expected
            }
            if (!expected.message.contains(
                    'Production-signed APK cannot package the CS2 integration-only artifact.')) {
                throw expected
            }
        }
    }
}

