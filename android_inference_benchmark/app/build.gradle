tasks.register('verifyQnnHtpArchitectureClosure') {
    group = 'verification'
    description = 'Verifies the packaged QNN HTP runtime closure for every supported architecture.'
    dependsOn(
            tasks.named('stageQnnHtpRuntime'),
            tasks.named('stageQnnHtpSkeleton'),
            tasks.named('verifyOw2QnnReleaseArtifact'),
            tasks.named('verifyCs2QnnIntegrationArtifact'))
    doLast {
        if (qnnSdkRoot.isBlank()) {
            throw new GradleException('QNN SDK root is required for HTP architecture verification.')
        }
        def unavailableRequiredArchitectures = missingRequiredQnnHtpArchitectures(
                requiredQnnHtpArchitectures, qnnHtpArchitectures)
        if (!unavailableRequiredArchitectures.isEmpty()) {
            throw new GradleException(
                    'QNN SDK does not provide the required HTP stub/skeleton pairs: '
                            + unavailableRequiredArchitectures.join(', ')
                            + ". SDK root=${qnnSdkRoot}")
        }
        def requiredRuntimeFiles = [
                'libQnnHtp.so',
                'libQnnHtpPrepare.so',
                'libvalorant_416_v11s_no_flash_w8a16.so',
                'libow2_416_w8a16.so',
                'libdelta_416_v8s_w8a16.so',
                'libcs2_vombit_416_v8s_w8a16.so'
        ] + qnnHtpArchitectures.collect { architecture ->
            "libQnnHtp${architecture.toUpperCase()}Stub.so"
        }
        def requiredAssetFiles = ['libQnnHtp.so'] + qnnHtpArchitectures.collect { architecture ->
            "libQnnHtp${architecture.toUpperCase()}Skel.so"
        }
        def missing = []
        requiredRuntimeFiles.each { name ->
            def candidate = new File(qnnRuntimeDir, name)
            if (!candidate.isFile() || candidate.length() == 0L) missing.add(candidate.path)
        }
        requiredAssetFiles.each { name ->
            def candidate = new File(qnnAssetDir, name)
            if (!candidate.isFile() || candidate.length() == 0L) missing.add(candidate.path)
        }
        if (!missing.isEmpty()) {
            throw new GradleException('Incomplete QNN HTP architecture closure: ' + missing.join(', '))
        }
        logger.lifecycle(
                "QNN_HTP_ARCHITECTURE_CLOSURE_OK architectures=${qnnHtpArchitectures.join(',')}"
                        + " required=${requiredQnnHtpArchitectures.join(',')}")
    }
}

tasks.register('verifyQnnHtpArchitectureDiscoveryPolicy') {
    group = 'verification'
    description = 'Verifies future-safe stub/skeleton discovery and strict required architecture parsing.'
    doLast {
        File syntheticSdk = layout.buildDirectory.dir(
                'qnn-architecture-discovery-contract/sdk').get().asFile
        project.delete(syntheticSdk)
        File androidLibraries = new File(syntheticSdk, 'lib/aarch64-android')
        if (!androidLibraries.mkdirs()) {
            throw new GradleException("Unable to create synthetic QNN SDK: ${androidLibraries}")
        }
        def addStub = { String architecture ->
            new File(androidLibraries,
                    "libQnnHtp${architecture.toUpperCase(Locale.ROOT)}Stub.so").bytes = [1] as byte[]
        }
        def addSkeleton = { String architecture ->
            File directory = new File(
                    syntheticSdk, "lib/hexagon-${architecture}/unsigned")
            if (!directory.isDirectory() && !directory.mkdirs()) {
                throw new GradleException("Unable to create synthetic skeleton directory: ${directory}")
            }
            new File(directory,
                    "libQnnHtp${architecture.toUpperCase(Locale.ROOT)}Skel.so").bytes = [1] as byte[]
        }
        ['v68', 'v69', 'v73', 'v75', 'v79', 'v81', 'v83'].each {
            addStub(it)
            addSkeleton(it)
        }
        addStub('v85')
        addSkeleton('v87')
        List<String> discovered = discoverQnnHtpArchitectures(syntheticSdk)
        if (discovered != ['v68', 'v69', 'v73', 'v75', 'v79', 'v81', 'v83']) {
            throw new GradleException("Unexpected QNN architecture discovery: ${discovered}")
        }
        if (parseQnnHtpArchitectures('v68;v83') != ['v68', 'v83']
                || missingRequiredQnnHtpArchitectures(['v68', 'v85'], discovered) != ['v85']) {
            throw new GradleException('QNN required architecture policy contract failed.')
        }
        for (String invalid : ['v68,v68', 'V', 'v8', 'v1234', '../v81']) {
            try {
                parseQnnHtpArchitectures(invalid)
                throw new GradleException("Invalid QNN architecture was accepted: ${invalid}")
            } catch (GradleException expected) {
                if (expected.message.startsWith('Invalid QNN architecture was accepted:')) throw expected
            }
        }
    }
}

tasks.register('verifyQnnSdkModelToolchainIdentityPolicy') {
    group = 'verification'
    description = 'Rejects a newer QNN runtime paired with models approved for another SDK.'
    doLast {
        File syntheticSdk = layout.buildDirectory.dir(
                'qnn-sdk-model-identity-contract/sdk').get().asFile
        project.delete(syntheticSdk)
        File androidLibraries = new File(syntheticSdk, 'lib/aarch64-android')
        File v81Skeletons = new File(syntheticSdk, 'lib/hexagon-v81/unsigned')
        if (!androidLibraries.mkdirs() || !v81Skeletons.mkdirs()) {
            throw new GradleException(
                    "Unable to create synthetic QNN SDK identity fixture: ${syntheticSdk}")
        }
        new File(syntheticSdk, 'sdk.yaml').setText(
                'product: QAIRT\n'
                        + 'version: 2.40.0\n'
                        + 'build_id: 260101123456_654321\n',
                'UTF-8')
        new File(androidLibraries, 'libQnnHtpV81Stub.so').bytes = [1] as byte[]
        new File(v81Skeletons, 'libQnnHtpV81Skel.so').bytes = [1] as byte[]
        if (discoverQnnHtpArchitectures(syntheticSdk) != ['v81']) {
            throw new GradleException(
                    'Synthetic V81 QNN SDK architecture discovery failed.')
        }
        def syntheticIdentity = readQnnSdkIdentity(syntheticSdk)
        if (syntheticIdentity.normalized != '2.40.0.260101') {
            throw new GradleException(
                    "Unexpected synthetic QNN SDK identity: ${syntheticIdentity.normalized}")
        }
        try {
            requireQnnSdkIdentity(syntheticSdk, '2.37.1.250807')
            throw new GradleException(
                    'Mismatched V81 QNN SDK/model identity was accepted.')
        } catch (GradleException expected) {
            if (expected.message == 'Mismatched V81 QNN SDK/model identity was accepted.') {
                throw expected
            }
            if (!expected.message.startsWith(
                    'QNN SDK/model toolchain identity mismatch:')) {
                throw expected
            }
        }
    }
}

tasks.configureEach { task ->
    // CMake compiles the shared wire/protocol sources from the sibling runtime
    // project.  They are outside this Android module, so declare them as task
    // inputs explicitly; otherwise Gradle can package an old native library
    // after a shared-source change.
    if (task.name.startsWith('buildCMake')) {
        task.inputs.dir(project.rootProject.file('../dual_machine_runtime/shared'))
                .withPathSensitivity(PathSensitivity.RELATIVE)
    }
    if (task.name.startsWith('merge') && (task.name.endsWith('NativeLibs') || task.name.endsWith('JniLibFolders'))) {
        task.dependsOn(tasks.named('stageQnnHtpRuntime'))
    }
    if (task.name.startsWith('merge') && task.name.endsWith('Assets')) {
        task.dependsOn(tasks.named('stageQnnHtpSkeleton'))
    }
    // Release lint also snapshots source assets.  Declare the generated HTP
    // skeleton as an input producer so Gradle 9 cannot race lint with staging.
    if (task.name.toLowerCase().contains('lint')) {
        task.dependsOn(tasks.named('stageQnnHtpSkeleton'))
    }
}

// This module keeps dependency-free contract checks under src/test and runs
// them through the explicit verify* JavaExec tasks below. They are not JUnit
// tests, so Gradle 9's empty-test-suite failure must not mask those real gates.
tasks.withType(Test).configureEach {
    failOnNoDiscoveredTests = false
}

// Production output must never silently fall back to a known debug key. An
// explicit local-only switch permits device development before the offline
// release identity is supplied, while keeping its non-production status clear.
tasks.register('verifyReleaseSigningIdentity') {
    group = 'verification'
    doLast {
        if (hasProductionReleaseSigning) {
            requireProductionReleaseSigningCertificate()
            return
        }
        if (!allowDevelopmentReleaseSigning) {
            throw new GradleException('Release signing key is required. For local device validation only, pass -PvisionforgeAllowDevelopmentSigning=true.')
        }
    }
}
tasks.configureEach { task ->
    if (task.name == 'packageRelease') task.dependsOn(tasks.named('verifyReleaseSigningIdentity'))
}

